<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synclined</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme tokens ───────────────────────────────────────── */
:root {
  --bg:          #080a10;
  --border:      rgba(255,255,255,0.07);
  --border-hi:   rgba(255,255,255,0.13);
  --text:        #e8edf5;
  --muted:       #4a5568;
  --body-text:   #d1d9e8;
  --card-bg:     rgba(255,255,255,0.03);
  --card-hover:  rgba(255,255,255,0.055);
  --card-shadow: none;
  --header-bg:   rgba(8,10,16,0.88);
  --form-bg:     rgba(255,255,255,0.04);
  --toast-bg:    rgba(14,16,24,0.95);
  --chip-bg:     rgba(255,255,255,0.04);
  --dot-color:   rgba(255,255,255,0.025);
  --scrollbar:   rgba(255,255,255,0.07);
  --shimmer:     rgba(255,255,255,0.03);

  --teal:   #10b981;
  --blue:   #3b82f6;
  --purple: #8b5cf6;
  --pink:   #ec4899;
  --amber:  #f59e0b;
  --cyan:   #06b6d4;
}

html.light {
  --bg:          #f0f2f8;
  --border:      rgba(0,0,0,0.09);
  --border-hi:   rgba(0,0,0,0.16);
  --text:        #0f172a;
  --muted:       #64748b;
  --body-text:   #334155;
  --card-bg:     rgba(255,255,255,0.82);
  --card-hover:  rgba(255,255,255,1);
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04);
  --header-bg:   rgba(240,242,248,0.92);
  --form-bg:     rgba(255,255,255,0.9);
  --toast-bg:    rgba(255,255,255,0.97);
  --chip-bg:     rgba(0,0,0,0.04);
  --dot-color:   rgba(0,0,0,0.055);
  --scrollbar:   rgba(0,0,0,0.1);
  --shimmer:     rgba(0,0,0,0.015);
}

/* ── Base ───────────────────────────────────────────────── */
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  font-size: 13.5px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.2s, color 0.2s;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 30;
  background: var(--header-bg);
  backdrop-filter: blur(20px);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}

header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(16,185,129,0.45) 30%, rgba(59,130,246,0.45) 70%, transparent);
}

.logo-wrap { display: flex; align-items: center; gap: 11px; min-width: 0; }

.live-ring {
  position: relative; width: 10px; height: 10px; flex-shrink: 0;
}
.live-ring::before, .live-ring::after {
  content: ''; position: absolute; border-radius: 50%;
}
.live-ring::before { inset: 0; background: var(--teal); }
.live-ring::after {
  inset: -3px;
  border: 1.5px solid rgba(16,185,129,0.5);
  animation: ring-pulse 2.5s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0; transform: scale(1.7); }
}

.logo-name {
  font-size: 15px; font-weight: 700; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text) 0%, color-mix(in srgb, var(--text) 60%, transparent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}

.goal-label {
  font-size: 12.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.task-chip {
  font-size: 11px; font-weight: 500; color: var(--muted);
  background: var(--chip-bg); border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 99px; white-space: nowrap;
}

.theme-btn {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--chip-bg); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
  flex-shrink: 0;
}
.theme-btn:hover { background: var(--card-hover); border-color: var(--border-hi); color: var(--text); }
.theme-btn svg { width: 15px; height: 15px; }

/* ── Board layout ───────────────────────────────────────── */
.board {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: 1fr 390px;
  height: calc(100vh - 56px);
}

.panel {
  overflow-y: auto;
  padding: 24px 26px;
  border-right: 1px solid var(--border);
}
.panel:last-child { border-right: none; }

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}

.panel-label {
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
}

.count-chip {
  font-size: 11px; font-weight: 500;
  color: var(--muted); background: var(--chip-bg);
  border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 99px;
}

/* ── Cards ──────────────────────────────────────────────── */
.stack { display: flex; flex-direction: column; gap: 8px; }

.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 15px;
  backdrop-filter: blur(8px);
  box-shadow: var(--card-shadow);
  transition: background 0.14s, border-color 0.14s, box-shadow 0.14s;
  animation: rise 0.18s ease both;
  overflow: hidden;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card:hover {
  background: var(--card-hover);
  border-color: var(--border-hi);
}

.card::before {
  content: '';
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, var(--shimmer), transparent);
  transition: left 0.38s ease;
  pointer-events: none;
}
.card:hover::before { left: 150%; }

.card.confirmed {
  border-left: 2px solid;
}
.card.confirmed::after {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0; width: 56px;
  background: linear-gradient(90deg, var(--kind-glow, rgba(16,185,129,0.07)), transparent);
  pointer-events: none;
}

.k-goal     { --kind-glow: rgba(139,92,246,0.09);  border-left-color: var(--purple) !important; }
.k-decision { --kind-glow: rgba(59,130,246,0.09);  border-left-color: var(--blue) !important; }
.k-change   { --kind-glow: rgba(16,185,129,0.09);  border-left-color: var(--teal) !important; }
.k-question { --kind-glow: rgba(245,158,11,0.09);  border-left-color: var(--amber) !important; }
.k-handoff  { --kind-glow: rgba(6,182,212,0.09);   border-left-color: var(--cyan) !important; }

/* ── Chips ──────────────────────────────────────────────── */
.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

.kind-chip {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 5px; border: 1px solid;
}

.k-goal     .kind-chip { color: var(--purple); border-color: rgba(139,92,246,0.35); background: rgba(139,92,246,0.11); }
.k-decision .kind-chip { color: #93c5fd;       border-color: rgba(59,130,246,0.35);  background: rgba(59,130,246,0.11); }
.k-change   .kind-chip { color: #34d399;       border-color: rgba(16,185,129,0.35);  background: rgba(16,185,129,0.11); }
.k-question .kind-chip { color: #fbbf24;       border-color: rgba(245,158,11,0.35);  background: rgba(245,158,11,0.11); }
.k-handoff  .kind-chip { color: #67e8f9;       border-color: rgba(6,182,212,0.35);   background: rgba(6,182,212,0.11); }

html.light .k-decision .kind-chip { color: #1d4ed8; }
html.light .k-change   .kind-chip { color: #047857; }
html.light .k-question .kind-chip { color: #b45309; }
html.light .k-handoff  .kind-chip { color: #0e7490; }
html.light .k-goal     .kind-chip { color: #6d28d9; }

.actor-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500;
  padding: 2px 8px; border-radius: 99px; border: 1px solid;
}
.actor-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; opacity: 0.8;
}

.a-voice  { color: var(--pink);  border-color: rgba(236,72,153,0.25);  background: rgba(236,72,153,0.08); }
.a-claude { color: #a5b4fc;      border-color: rgba(129,140,248,0.25); background: rgba(129,140,248,0.08); }
.a-other  { color: var(--muted); border-color: var(--border);          background: transparent; }

html.light .a-voice  { color: #be185d; }
html.light .a-claude { color: #4f46e5; }

.card-body { font-size: 13px; color: var(--body-text); line-height: 1.55; }

.flags { display: flex; gap: 5px; margin-top: 8px; }
.flag {
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  padding: 2px 8px; border-radius: 4px;
}
.flag-stale     { background: rgba(245,158,11,0.11);  color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
.flag-conflict  { background: rgba(248,113,113,0.11); color: #fca5a5; border: 1px solid rgba(248,113,113,0.2); }
.flag-sensitive { background: rgba(167,139,250,0.11); color: #c4b5fd; border: 1px solid rgba(167,139,250,0.2); }

html.light .flag-stale     { color: #92400e; }
html.light .flag-conflict  { color: #991b1b; }
html.light .flag-sensitive { color: #5b21b6; }

/* ── Action buttons ─────────────────────────────────────── */
.actions { display: flex; gap: 7px; margin-top: 11px; }

.btn {
  flex: 1; padding: 7px 12px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  border-radius: 8px; border: 1px solid;
  cursor: pointer; transition: all 0.14s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: none;
}

.btn-accept {
  color: #34d399;
  border-color: rgba(16,185,129,0.3);
  background: rgba(16,185,129,0.07);
}
.btn-accept:hover {
  background: rgba(16,185,129,0.16);
  border-color: rgba(16,185,129,0.5);
  box-shadow: 0 0 12px rgba(16,185,129,0.14);
}

.btn-reject {
  color: #fca5a5;
  border-color: rgba(248,113,113,0.2);
  background: rgba(248,113,113,0.05);
}
.btn-reject:hover {
  background: rgba(248,113,113,0.13);
  border-color: rgba(248,113,113,0.38);
}

html.light .btn-accept { color: #047857; }
html.light .btn-reject { color: #b91c1c; }

/* ── Empty state ────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; padding: 42px 0;
  color: var(--muted); font-size: 12.5px; text-align: center;
}
.empty-icon { font-size: 24px; opacity: 0.25; }

/* ── Propose section ────────────────────────────────────── */
.propose-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.form-row { display: flex; gap: 7px; margin-bottom: 8px; }

select, input[type="text"], textarea {
  background: var(--form-bg);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  font-family: inherit;
  width: 100%;
  transition: border-color 0.14s, box-shadow 0.14s;
}
select:focus, input:focus, textarea:focus {
  border-color: rgba(59,130,246,0.45);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
}
select { cursor: pointer; }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

html.light select { color-scheme: light; }

.btn-submit {
  width: 100%; margin-top: 8px; padding: 10px;
  background: linear-gradient(135deg, rgba(59,130,246,0.13), rgba(16,185,129,0.09));
  border: 1px solid rgba(59,130,246,0.28);
  color: #93c5fd;
  border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.14s; letter-spacing: 0.02em;
}
.btn-submit:hover {
  background: linear-gradient(135deg, rgba(59,130,246,0.21), rgba(16,185,129,0.15));
  border-color: rgba(59,130,246,0.45);
  box-shadow: 0 0 14px rgba(59,130,246,0.11);
}
html.light .btn-submit { color: #1d4ed8; }

/* ── Divider ────────────────────────────────────────────── */
.divider {
  display: flex; align-items: center; gap: 10px;
  font-size: 10.5px; color: var(--muted);
  font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 14px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 99;
  display: flex; align-items: center; gap: 9px;
  background: var(--toast-bg);
  border: 1px solid var(--border-hi);
  border-radius: 10px; padding: 11px 16px;
  font-size: 13px; color: var(--text);
  backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
  box-shadow: 0 8px 28px rgba(0,0,0,0.35);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

html.light .toast { box-shadow: 0 8px 28px rgba(0,0,0,0.12); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="live-ring"></div>
    <span class="logo-name">synclined</span>
    <span class="goal-label" id="goal-text">connecting…</span>
  </div>
  <div class="header-right">
    <span class="task-chip" id="task-chip">—</span>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</header>

<div class="board">

  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">Approved Context</span>
      <span class="count-chip" id="approved-count">0</span>
    </div>
    <div class="stack" id="approved-list"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">Pending Review</span>
      <span class="count-chip" id="pending-count">0</span>
    </div>
    <div class="stack" id="pending-list"></div>

    <div class="propose-section">
      <div class="divider">New Proposal</div>
      <div class="form-row">
        <select id="p-kind" style="flex:0 0 auto;width:auto">
          <option value="decision">Decision</option>
          <option value="change">Change</option>
          <option value="open_question">Question</option>
          <option value="goal">Goal</option>
          <option value="handoff">Handoff</option>
        </select>
        <input type="text" id="p-actor" placeholder="actor" value="claude-code">
      </div>
      <textarea id="p-content" placeholder="Describe the decision, change, or question…"></textarea>
      <button class="btn-submit" onclick="submitProposal()">Submit proposal →</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">
  <div class="toast-dot" id="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
const KINDS = { goal:'Goal', decision:'Decision', change:'Change', open_question:'Question', handoff:'Handoff' };
const KIND_CLASS = { goal:'k-goal', decision:'k-decision', change:'k-change', open_question:'k-question', handoff:'k-handoff' };

function actorClass(a='') {
  if (a.toLowerCase().includes('voice')) return 'a-voice';
  if (a.toLowerCase().includes('claude') || a.toLowerCase().includes('code')) return 'a-claude';
  return 'a-other';
}

function kc(k) { return KIND_CLASS[k] || 'k-decision'; }
function kl(k) { return KINDS[k] || k; }
function esc(s='') { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Theme ──────────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('synclined-theme');
  if (saved === 'light') applyLight(true);
})();

function applyLight(on) {
  document.documentElement.classList.toggle('light', on);
  document.getElementById('icon-moon').style.display = on ? 'none' : '';
  document.getElementById('icon-sun').style.display  = on ? '' : 'none';
}

function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('synclined-theme', isLight ? 'light' : 'dark');
  document.getElementById('icon-moon').style.display = isLight ? 'none' : '';
  document.getElementById('icon-sun').style.display  = isLight ? '' : 'none';
}

// ── Toast ──────────────────────────────────────────────
let toastTimer;
function toast(msg, color = '#34d399') {
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-dot').style.background = color;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Render ─────────────────────────────────────────────
function renderApproved(records) {
  document.getElementById('approved-count').textContent = records.length;
  const el = document.getElementById('approved-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div>No approved records yet.<br>Accept a pending proposal to start.</div></div>`;
    return;
  }
  el.innerHTML = records.map(r => `
    <div class="card confirmed ${kc(r.kind)}">
      <div class="card-meta">
        <span class="kind-chip">${kl(r.kind)}</span>
        <span class="actor-chip ${actorClass(r.actor)}">${esc(r.actor)}</span>
      </div>
      <div class="card-body">${esc(r.content)}</div>
    </div>
  `).join('');
}

function renderPending(records) {
  document.getElementById('pending-count').textContent = records.length;
  const el = document.getElementById('pending-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✓</div><div>Nothing to review.</div></div>`;
    return;
  }
  el.innerHTML = records.map(r => {
    const flags = [
      r.is_stale    ? '<span class="flag flag-stale">stale</span>'        : '',
      r.is_conflict ? '<span class="flag flag-conflict">conflict</span>'   : '',
      r.sensitive && r.sensitive !== 'not_required'
                    ? '<span class="flag flag-sensitive">sensitive</span>' : '',
    ].filter(Boolean).join('');
    return `
      <div class="card ${kc(r.kind)}">
        <div class="card-meta">
          <span class="kind-chip">${kl(r.kind)}</span>
          <span class="actor-chip ${actorClass(r.actor)}">${esc(r.actor)}</span>
        </div>
        <div class="card-body">${esc(r.content)}</div>
        ${flags ? `<div class="flags">${flags}</div>` : ''}
        <div class="actions">
          <button class="btn btn-accept" onclick="accept(${r.id})">&#10003; Accept</button>
          <button class="btn btn-reject" onclick="reject(${r.id})">&#10007; Reject</button>
        </div>
      </div>
    `;
  }).join('');
}

async function accept(id) {
  await fetch(`/accept/${id}`, { method:'POST' });
  toast('Accepted', '#34d399');
  refresh();
}

async function reject(id) {
  await fetch(`/reject/${id}`, { method:'POST' });
  toast('Rejected', '#fca5a5');
  refresh();
}

async function submitProposal() {
  const kind    = document.getElementById('p-kind').value;
  const actor   = document.getElementById('p-actor').value.trim() || 'board';
  const content = document.getElementById('p-content').value.trim();
  if (!content) return;
  const r = await fetch('/propose', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, actor, content }),
  });
  if (r.ok) {
    document.getElementById('p-content').value = '';
    toast('Proposed', '#93c5fd');
    refresh();
  }
}

async function refresh() {
  try {
    const [snap, pend] = await Promise.all([
      fetch('/snapshot').then(r => r.json()),
      fetch('/pending').then(r => r.json()),
    ]);
    document.getElementById('goal-text').textContent = snap.goal || '';
    document.getElementById('task-chip').textContent = `task ${snap.task_id}`;
    renderApproved(snap.confirmed || []);
    renderPending(pend.pending   || []);
  } catch {
    document.getElementById('goal-text').textContent = 'server unreachable — start synclined-server';
  }
}

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
