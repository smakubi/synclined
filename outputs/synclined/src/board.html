<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synclined</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #080a10;
  --surface:  #0e1018;
  --border:   rgba(255,255,255,0.07);
  --border-hi:rgba(255,255,255,0.13);
  --text:     #e8edf5;
  --muted:    #4a5568;
  --dim:      #2a3045;

  /* palette */
  --teal:   #10b981;
  --blue:   #3b82f6;
  --orange: #f97316;
  --purple: #8b5cf6;
  --pink:   #ec4899;
  --amber:  #f59e0b;
  --cyan:   #06b6d4;

  /* kind → color */
  --goal-c:     var(--purple);
  --decision-c: var(--blue);
  --change-c:   var(--teal);
  --question-c: var(--amber);
  --handoff-c:  var(--cyan);
}

/* ── Base ───────────────────────────────────────────────── */
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  font-size: 13.5px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* dot grid */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

/* ambient glow blobs */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 55% 40% at 15% 10%, rgba(16,185,129,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 45% 35% at 85% 85%, rgba(59,130,246,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 30% 25% at 55% 50%, rgba(139,92,246,0.04) 0%, transparent 60%);
  pointer-events: none;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(8,10,16,0.88);
  backdrop-filter: blur(20px);
  padding: 0 28px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px;
}

/* gradient border bottom */
header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(16,185,129,0.5) 25%, rgba(59,130,246,0.5) 75%, transparent 100%);
}

.logo-wrap { display: flex; align-items: center; gap: 12px; }

.live-ring {
  position: relative; width: 10px; height: 10px;
}
.live-ring::before, .live-ring::after {
  content: ''; position: absolute;
  border-radius: 50%;
}
.live-ring::before {
  inset: 0; background: var(--teal);
}
.live-ring::after {
  inset: -3px;
  border: 1.5px solid rgba(16,185,129,0.5);
  animation: ring-pulse 2.5s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0; transform: scale(1.6); }
}

.logo-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #e8edf5 0%, rgba(232,237,245,0.65) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.goal-label {
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 440px;
}

.task-chip {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 99px;
  white-space: nowrap;
}

/* ── Board layout ───────────────────────────────────────── */
.board {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 1fr 390px;
  height: calc(100vh - 58px);
}

.panel {
  overflow-y: auto;
  padding: 26px 28px;
  border-right: 1px solid var(--border);
}
.panel:last-child { border-right: none; }

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}

.panel-label {
  font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
}

.count-chip {
  font-size: 11px; font-weight: 500;
  letter-spacing: normal; text-transform: none;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  padding: 2px 9px; border-radius: 99px;
}

/* ── Cards ──────────────────────────────────────────────── */
.stack { display: flex; flex-direction: column; gap: 9px; }

.card {
  position: relative;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  backdrop-filter: blur(8px);
  transition: background 0.14s, border-color 0.14s, box-shadow 0.14s;
  animation: rise 0.2s ease both;
  overflow: hidden;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card:hover {
  background: rgba(255,255,255,0.05);
  border-color: var(--border-hi);
}

/* shimmer on hover */
.card::before {
  content: '';
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  transition: left 0.4s ease;
  pointer-events: none;
}
.card:hover::before { left: 150%; }

/* confirmed cards — colored left glow */
.card.confirmed {
  border-left: 2px solid;
}
.card.confirmed::after {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0; width: 60px;
  background: linear-gradient(90deg, var(--kind-glow, rgba(16,185,129,0.08)), transparent);
  pointer-events: none;
}

/* kind → glow variables */
.k-goal     { --kind-glow: rgba(139,92,246,0.1);  border-left-color: var(--goal-c) !important; }
.k-decision { --kind-glow: rgba(59,130,246,0.1);  border-left-color: var(--decision-c) !important; }
.k-change   { --kind-glow: rgba(16,185,129,0.1);  border-left-color: var(--change-c) !important; }
.k-question { --kind-glow: rgba(245,158,11,0.1);  border-left-color: var(--question-c) !important; }
.k-handoff  { --kind-glow: rgba(6,182,212,0.1);   border-left-color: var(--handoff-c) !important; }

/* ── Chips ──────────────────────────────────────────────── */
.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

.kind-chip {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 5px; border: 1px solid;
}

.k-goal     .kind-chip { color: var(--purple); border-color: rgba(139,92,246,0.35); background: rgba(139,92,246,0.12); }
.k-decision .kind-chip { color: #93c5fd;       border-color: rgba(59,130,246,0.35);  background: rgba(59,130,246,0.12); }
.k-change   .kind-chip { color: #6ee7b7;       border-color: rgba(16,185,129,0.35);  background: rgba(16,185,129,0.12); }
.k-question .kind-chip { color: #fcd34d;       border-color: rgba(245,158,11,0.35);  background: rgba(245,158,11,0.12); }
.k-handoff  .kind-chip { color: #67e8f9;       border-color: rgba(6,182,212,0.35);   background: rgba(6,182,212,0.12); }

.actor-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 500;
  padding: 2px 8px; border-radius: 99px; border: 1px solid;
}
.actor-chip::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; opacity: 0.8;
}

.a-voice  { color: var(--pink);   border-color: rgba(236,72,153,0.25); background: rgba(236,72,153,0.08); }
.a-claude { color: #a5b4fc;       border-color: rgba(129,140,248,0.25); background: rgba(129,140,248,0.08); }
.a-other  { color: var(--muted);  border-color: var(--border);          background: transparent; }

.card-body { font-size: 13px; color: #d1d9e8; line-height: 1.55; }

/* flags */
.flags { display: flex; gap: 5px; margin-top: 8px; }
.flag {
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  padding: 2px 8px; border-radius: 4px;
}
.flag-stale    { background: rgba(245,158,11,0.12); color: #fcd34d; border: 1px solid rgba(245,158,11,0.2); }
.flag-conflict { background: rgba(248,113,113,0.12); color: #fca5a5; border: 1px solid rgba(248,113,113,0.2); }
.flag-sensitive{ background: rgba(167,139,250,0.12); color: #c4b5fd; border: 1px solid rgba(167,139,250,0.2); }

/* ── Action buttons ─────────────────────────────────────── */
.actions { display: flex; gap: 8px; margin-top: 12px; }

.btn {
  flex: 1; padding: 8px 12px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  border-radius: 8px; border: 1px solid;
  cursor: pointer; transition: all 0.14s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  background: none;
}

.btn-accept {
  color: #6ee7b7;
  border-color: rgba(16,185,129,0.3);
  background: rgba(16,185,129,0.08);
}
.btn-accept:hover {
  background: rgba(16,185,129,0.18);
  border-color: rgba(16,185,129,0.5);
  box-shadow: 0 0 14px rgba(16,185,129,0.15);
}

.btn-reject {
  color: #fca5a5;
  border-color: rgba(248,113,113,0.2);
  background: rgba(248,113,113,0.05);
}
.btn-reject:hover {
  background: rgba(248,113,113,0.13);
  border-color: rgba(248,113,113,0.38);
}

/* ── Empty state ────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; padding: 44px 0;
  color: var(--muted); font-size: 12.5px;
  text-align: center;
}
.empty-icon { font-size: 26px; opacity: 0.3; }

/* ── Propose section ────────────────────────────────────── */
.propose-section {
  margin-top: 26px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}

.form-row { display: flex; gap: 7px; margin-bottom: 8px; }

select, input[type="text"], textarea {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  font-family: inherit;
  width: 100%;
  transition: border-color 0.14s, box-shadow 0.14s;
}
select:focus, input:focus, textarea:focus {
  border-color: rgba(59,130,246,0.45);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
}
select { cursor: pointer; }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

.btn-submit {
  width: 100%; margin-top: 8px;
  padding: 10px;
  background: linear-gradient(135deg, rgba(59,130,246,0.14), rgba(16,185,129,0.1));
  border: 1px solid rgba(59,130,246,0.28);
  color: #93c5fd;
  border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.14s; letter-spacing: 0.02em;
}
.btn-submit:hover {
  background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(16,185,129,0.16));
  border-color: rgba(59,130,246,0.45);
  box-shadow: 0 0 16px rgba(59,130,246,0.12);
}

/* ── Divider ────────────────────────────────────────────── */
.divider {
  display: flex; align-items: center; gap: 10px;
  font-size: 10.5px; color: var(--muted);
  font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 14px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 99;
  display: flex; align-items: center; gap: 9px;
  background: rgba(14,16,24,0.95);
  border: 1px solid var(--border-hi);
  border-radius: 10px; padding: 11px 16px;
  font-size: 13px; color: var(--text);
  backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-dot { width: 7px; height: 7px; border-radius: 50%; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 99px; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="live-ring"></div>
    <span class="logo-name">synclined</span>
    <span class="goal-label" id="goal-text">connecting…</span>
  </div>
  <span class="task-chip" id="task-chip">—</span>
</header>

<div class="board">

  <!-- Approved Context -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">Approved Context</span>
      <span class="count-chip" id="approved-count">0</span>
    </div>
    <div class="stack" id="approved-list"></div>
  </div>

  <!-- Pending + Propose -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-label">Pending Review</span>
      <span class="count-chip" id="pending-count">0</span>
    </div>
    <div class="stack" id="pending-list"></div>

    <div class="propose-section">
      <div class="divider">New Proposal</div>
      <div class="form-row">
        <select id="p-kind" style="flex:0 0 auto;width:auto">
          <option value="decision">Decision</option>
          <option value="change">Change</option>
          <option value="open_question">Question</option>
          <option value="goal">Goal</option>
          <option value="handoff">Handoff</option>
        </select>
        <input type="text" id="p-actor" placeholder="actor" value="claude-code">
      </div>
      <textarea id="p-content" placeholder="Describe the decision, change, or question…"></textarea>
      <button class="btn-submit" onclick="submitProposal()">Submit proposal →</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">
  <div class="toast-dot" id="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
const KINDS = { goal:'Goal', decision:'Decision', change:'Change', open_question:'Question', handoff:'Handoff' };
const KIND_CLASS = { goal:'k-goal', decision:'k-decision', change:'k-change', open_question:'k-question', handoff:'k-handoff' };

function actorClass(a='') {
  if (a.toLowerCase().includes('voice')) return 'a-voice';
  if (a.toLowerCase().includes('claude') || a.toLowerCase().includes('code')) return 'a-claude';
  return 'a-other';
}

function kc(k) { return KIND_CLASS[k] || 'k-decision'; }
function kl(k) { return KINDS[k] || k; }
function esc(s='') { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function toast(msg, color = '#6ee7b7') {
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-dot').style.background = color;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function renderApproved(records) {
  document.getElementById('approved-count').textContent = records.length;
  const el = document.getElementById('approved-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">◎</div>
      <div>No approved records yet.<br>Accept a pending proposal to start.</div>
    </div>`;
    return;
  }
  el.innerHTML = records.map(r => `
    <div class="card confirmed ${kc(r.kind)}">
      <div class="card-meta">
        <span class="kind-chip">${kl(r.kind)}</span>
        <span class="actor-chip ${actorClass(r.actor)}">${esc(r.actor)}</span>
      </div>
      <div class="card-body">${esc(r.content)}</div>
    </div>
  `).join('');
}

function renderPending(records) {
  document.getElementById('pending-count').textContent = records.length;
  const el = document.getElementById('pending-list');
  if (!records.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">✓</div>
      <div>Nothing to review.</div>
    </div>`;
    return;
  }
  el.innerHTML = records.map(r => {
    const flags = [
      r.is_stale    ? '<span class="flag flag-stale">stale</span>'         : '',
      r.is_conflict ? '<span class="flag flag-conflict">conflict</span>'    : '',
      r.sensitive && r.sensitive !== 'not_required'
                    ? '<span class="flag flag-sensitive">sensitive</span>'  : '',
    ].filter(Boolean).join('');
    return `
      <div class="card ${kc(r.kind)}">
        <div class="card-meta">
          <span class="kind-chip">${kl(r.kind)}</span>
          <span class="actor-chip ${actorClass(r.actor)}">${esc(r.actor)}</span>
        </div>
        <div class="card-body">${esc(r.content)}</div>
        ${flags ? `<div class="flags">${flags}</div>` : ''}
        <div class="actions">
          <button class="btn btn-accept" onclick="accept(${r.id})">✓ Accept</button>
          <button class="btn btn-reject" onclick="reject(${r.id})">✗ Reject</button>
        </div>
      </div>
    `;
  }).join('');
}

async function accept(id) {
  await fetch(`/accept/${id}`, { method:'POST' });
  toast('Accepted', '#6ee7b7');
  refresh();
}

async function reject(id) {
  await fetch(`/reject/${id}`, { method:'POST' });
  toast('Rejected', '#fca5a5');
  refresh();
}

async function submitProposal() {
  const kind    = document.getElementById('p-kind').value;
  const actor   = document.getElementById('p-actor').value.trim() || 'board';
  const content = document.getElementById('p-content').value.trim();
  if (!content) return;
  const r = await fetch('/propose', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, actor, content }),
  });
  if (r.ok) {
    document.getElementById('p-content').value = '';
    toast('Proposed →', '#93c5fd');
    refresh();
  }
}

async function refresh() {
  try {
    const [snap, pend] = await Promise.all([
      fetch('/snapshot').then(r => r.json()),
      fetch('/pending').then(r => r.json()),
    ]);
    document.getElementById('goal-text').textContent = snap.goal || '';
    document.getElementById('task-chip').textContent = `task ${snap.task_id}`;
    renderApproved(snap.confirmed || []);
    renderPending(pend.pending   || []);
  } catch {
    document.getElementById('goal-text').textContent = 'server unreachable — start synclined-server';
  }
}

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
