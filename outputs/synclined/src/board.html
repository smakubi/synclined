<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synclined</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #06060e;
  --surface:      #0c0e1a;
  --card:         rgba(255,255,255,0.03);
  --card-border:  rgba(255,255,255,0.07);
  --card-hover:   rgba(255,255,255,0.055);
  --text:         #e8eaf0;
  --muted:        #4a5568;
  --subtle:       #2d3550;

  --goal:       #a78bfa;
  --decision:   #60a5fa;
  --change:     #34d399;
  --question:   #fbbf24;
  --handoff:    #22d3ee;

  --voice:  #f472b6;
  --claude: #818cf8;
  --other:  #64748b;

  --accept: #34d399;
  --reject: #f87171;
  --accent: #818cf8;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
  font-size: 13.5px;
  line-height: 1.6;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 0%, rgba(129,140,248,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 100%, rgba(244,114,182,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(6,6,14,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--card-border);
  padding: 0 28px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accept);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
  50%      { box-shadow: 0 0 0 5px rgba(52,211,153,0); }
}

.logo-name {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--text);
}

.goal-pill {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 480px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.chip {
  font-size: 11px;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 3px 10px;
  border-radius: 99px;
  white-space: nowrap;
}

/* ── Layout ─────────────────────────────────────────────── */
.board {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 380px;
  height: calc(100vh - 56px);
}

.panel {
  overflow-y: auto;
  padding: 24px 28px;
  border-right: 1px solid var(--card-border);
}

.panel:last-child { border-right: none; }

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.panel-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

.badge {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: normal;
  text-transform: none;
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 1px 9px;
  border-radius: 99px;
  color: var(--muted);
}

/* ── Cards ──────────────────────────────────────────────── */
.stack { display: flex; flex-direction: column; gap: 8px; }

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 13px 15px;
  transition: background 0.12s, border-color 0.12s;
  animation: fadeUp 0.18s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.1); }

/* kind accent on confirmed cards */
.card.confirmed { border-left: 2px solid; }
.card.confirmed.k-goal     { border-left-color: var(--goal); }
.card.confirmed.k-decision { border-left-color: var(--decision); }
.card.confirmed.k-change   { border-left-color: var(--change); }
.card.confirmed.k-question { border-left-color: var(--question); }
.card.confirmed.k-handoff  { border-left-color: var(--handoff); }

.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 7px;
  flex-wrap: wrap;
}

.kind-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 5px;
  border: 1px solid;
}

.k-goal     .kind-tag { color: var(--goal);     border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.1); }
.k-decision .kind-tag { color: var(--decision);  border-color: rgba(96,165,250,0.3);  background: rgba(96,165,250,0.1); }
.k-change   .kind-tag { color: var(--change);    border-color: rgba(52,211,153,0.3);  background: rgba(52,211,153,0.1); }
.k-question .kind-tag { color: var(--question);  border-color: rgba(251,191,36,0.3);  background: rgba(251,191,36,0.1); }
.k-handoff  .kind-tag { color: var(--handoff);   border-color: rgba(34,211,238,0.3);  background: rgba(34,211,238,0.1); }

.actor-tag {
  font-size: 11.5px;
  font-weight: 500;
}

.a-voice  { color: var(--voice); }
.a-claude { color: var(--claude); }
.a-other  { color: var(--other); }

.card-content {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
}

/* flags */
.flags { display: flex; gap: 5px; margin-top: 7px; }
.flag {
  font-size: 10px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px; letter-spacing: 0.03em;
}
.flag-stale     { background: rgba(251,191,36,0.12);  color: #fbbf24; }
.flag-conflict  { background: rgba(248,113,113,0.12); color: #f87171; }
.flag-sensitive { background: rgba(167,139,250,0.12); color: #a78bfa; }

/* actions */
.actions { display: flex; gap: 7px; margin-top: 11px; }

.btn {
  flex: 1; padding: 7px 10px;
  font-size: 12px; font-weight: 500;
  border-radius: 7px; border: 1px solid;
  cursor: pointer; transition: all 0.12s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  letter-spacing: 0.01em;
  background: none;
}

.btn-accept {
  color: var(--accept);
  border-color: rgba(52,211,153,0.25);
  background: rgba(52,211,153,0.07);
}
.btn-accept:hover { background: rgba(52,211,153,0.16); border-color: rgba(52,211,153,0.4); }

.btn-reject {
  color: var(--reject);
  border-color: rgba(248,113,113,0.2);
  background: rgba(248,113,113,0.06);
}
.btn-reject:hover { background: rgba(248,113,113,0.14); border-color: rgba(248,113,113,0.35); }

/* ── Empty state ────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 40px 0;
  color: var(--muted); font-size: 12.5px;
}
.empty svg { opacity: 0.25; }

/* ── Propose form ───────────────────────────────────────── */
.propose-wrap {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--card-border);
}

.form-row { display: flex; gap: 7px; margin-bottom: 8px; }

select, input[type="text"], textarea {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 11px;
  outline: none;
  font-family: inherit;
  width: 100%;
  transition: border-color 0.12s;
}

select { cursor: pointer; }
select:focus, input:focus, textarea:focus { border-color: rgba(129,140,248,0.45); }

textarea { resize: vertical; min-height: 68px; line-height: 1.5; }

.btn-submit {
  width: 100%; margin-top: 8px;
  padding: 9px;
  background: rgba(129,140,248,0.1);
  border: 1px solid rgba(129,140,248,0.25);
  color: #a5b4fc;
  border-radius: 8px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.12s;
}
.btn-submit:hover { background: rgba(129,140,248,0.18); border-color: rgba(129,140,248,0.45); }

/* ── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 99;
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: 9px; padding: 10px 16px;
  font-size: 13px; color: var(--text);
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="live-dot"></div>
    <span class="logo-name">synclined</span>
    <span class="goal-pill" id="goal-text">connecting…</span>
  </div>
  <div class="header-right">
    <span class="chip" id="task-chip">—</span>
  </div>
</header>

<div class="board">

  <!-- Approved -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Approved Context</span>
      <span class="badge" id="approved-count">0</span>
    </div>
    <div class="stack" id="approved-list"></div>
  </div>

  <!-- Pending + Propose -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-label">Pending Review</span>
      <span class="badge" id="pending-count">0</span>
    </div>
    <div class="stack" id="pending-list"></div>

    <div class="propose-wrap">
      <div class="panel-header" style="margin-bottom:12px">
        <span class="panel-label">New Proposal</span>
      </div>
      <div class="form-row">
        <select id="p-kind" style="flex:0 0 auto;width:auto">
          <option value="decision">Decision</option>
          <option value="change">Change</option>
          <option value="open_question">Question</option>
          <option value="goal">Goal</option>
          <option value="handoff">Handoff</option>
        </select>
        <input type="text" id="p-actor" placeholder="actor" value="claude-code">
      </div>
      <textarea id="p-content" placeholder="Describe the decision, change, or question…"></textarea>
      <button class="btn-submit" onclick="submitProposal()">Submit proposal</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const KIND_LABEL = { goal:'Goal', decision:'Decision', change:'Change', open_question:'Question', handoff:'Handoff' };
const KIND_CLASS  = { goal:'k-goal', decision:'k-decision', change:'k-change', open_question:'k-question', handoff:'k-handoff' };

function actorClass(a='') {
  if (a.includes('voice')) return 'a-voice';
  if (a.includes('claude')) return 'a-claude';
  return 'a-other';
}

function esc(s='') {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function kindClass(k) { return KIND_CLASS[k] || 'k-decision'; }
function kindLabel(k) { return KIND_LABEL[k] || k; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function renderApproved(records) {
  const el = document.getElementById('approved-list');
  document.getElementById('approved-count').textContent = records.length;
  if (!records.length) {
    el.innerHTML = `<div class="empty">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>No approved records yet</span>
    </div>`;
    return;
  }
  el.innerHTML = records.map(r => `
    <div class="card confirmed ${kindClass(r.kind)}">
      <div class="card-meta">
        <span class="kind-tag">${kindLabel(r.kind)}</span>
        <span class="actor-tag ${actorClass(r.actor)}">${esc(r.actor)}</span>
      </div>
      <div class="card-content">${esc(r.content)}</div>
    </div>
  `).join('');
}

function renderPending(records) {
  const el = document.getElementById('pending-list');
  document.getElementById('pending-count').textContent = records.length;
  if (!records.length) {
    el.innerHTML = `<div class="empty">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" d="M5 13l4 4L19 7"/>
      </svg>
      <span>Nothing to review</span>
    </div>`;
    return;
  }
  el.innerHTML = records.map(r => {
    const flags = [
      r.is_stale    ? '<span class="flag flag-stale">stale</span>'        : '',
      r.is_conflict ? '<span class="flag flag-conflict">conflict</span>'   : '',
      r.sensitive && r.sensitive !== 'not_required'
                    ? '<span class="flag flag-sensitive">sensitive</span>' : '',
    ].filter(Boolean).join('');
    return `
      <div class="card ${kindClass(r.kind)}" id="c${r.id}">
        <div class="card-meta">
          <span class="kind-tag">${kindLabel(r.kind)}</span>
          <span class="actor-tag ${actorClass(r.actor)}">${esc(r.actor)}</span>
        </div>
        <div class="card-content">${esc(r.content)}</div>
        ${flags ? `<div class="flags">${flags}</div>` : ''}
        <div class="actions">
          <button class="btn btn-accept" onclick="accept(${r.id})">✓ Accept</button>
          <button class="btn btn-reject" onclick="reject(${r.id})">✗ Reject</button>
        </div>
      </div>
    `;
  }).join('');
}

async function accept(id) {
  await fetch(`/accept/${id}`, { method:'POST' });
  toast('Accepted ✓');
  refresh();
}

async function reject(id) {
  await fetch(`/reject/${id}`, { method:'POST' });
  toast('Rejected');
  refresh();
}

async function submitProposal() {
  const kind    = document.getElementById('p-kind').value;
  const actor   = document.getElementById('p-actor').value.trim() || 'board';
  const content = document.getElementById('p-content').value.trim();
  if (!content) return;
  const r = await fetch('/propose', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, actor, content }),
  });
  if (r.ok) {
    document.getElementById('p-content').value = '';
    toast('Proposed');
    refresh();
  }
}

async function refresh() {
  try {
    const [snap, pend] = await Promise.all([
      fetch('/snapshot').then(r => r.json()),
      fetch('/pending').then(r => r.json()),
    ]);
    document.getElementById('goal-text').textContent  = snap.goal  || '';
    document.getElementById('task-chip').textContent  = `task ${snap.task_id}`;
    renderApproved(snap.confirmed || []);
    renderPending(pend.pending   || []);
  } catch {
    document.getElementById('goal-text').textContent = 'server unreachable — is synclined-server running?';
  }
}

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
