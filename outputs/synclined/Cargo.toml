[package]
name = "synclined-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "synclined_core"
path = "src/lib.rs"

[[bin]]
name = "synclined-server"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
